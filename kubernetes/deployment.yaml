apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-website
  labels:
    app: devops-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-website
  template:
    metadata:
      labels:
        app: devops-website
    spec:
      containers:
        - name: devops-website
          image: atul03030304/devops-website:v1
          ports:
            - containerPort: 80
